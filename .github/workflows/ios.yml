name: Build Proxyma Connect iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Core Packages & Inspect Header
        run: |
          mkdir -p Packages
          gh repo clone wanliyunyan/LibXray Packages/LibXray
          gh repo clone EbrahimTahernejad/Tun2SocksKit Packages/Tun2SocksKit
          gh release download 26.11.9 -R wanliyunyan/LibXray -p "LibXray.xcframework.zip"
          unzip -q LibXray.xcframework.zip -d temp_xray
          find temp_xray -name "*.h" -exec cat {} +
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App (Unsigned)
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project ProxymaConnect.xcodeproj \
            -scheme ProxymaConnect \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD"
            
