name: Build Proxyma Connect iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Core Packages
        run: |
          mkdir -p Packages
          gh repo clone wanliyunyan/LibXray Packages/LibXray
          gh repo clone EbrahimTahernejad/Tun2SocksKit Packages/Tun2SocksKit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild build -quiet \
            -project ProxymaConnect.xcodeproj \
            -scheme ProxymaConnect \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 20
          exit ${PIPESTATUS[0]}
          
