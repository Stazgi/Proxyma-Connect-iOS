name: ProxymaConnect
options:
  bundleIdPrefix: com.proxyma
  deploymentTarget:
    iOS: "16.0"

packages:
  LibXray:
    path: Packages/LibXray
  Tun2SocksKit:
    path: Packages/Tun2SocksKit

targets:
  ProxymaConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.proxyma.connect"
        INFOPLIST_KEY_CFBundleDisplayName: "Proxyma Connect"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: Sources/App/ProxymaConnect.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.proxyma.connect
    dependencies:
      - target: PacketTunnel
      - sdk: libresolv.tbd
      - sdk: libc++.tbd

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.proxyma.connect.tunnel"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    entitlements:
      path: Sources/Tunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.proxyma.connect
    dependencies:
      - package: LibXray
        product: LibXray
      - package: Tun2SocksKit
        product: Tun2SocksKit
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
